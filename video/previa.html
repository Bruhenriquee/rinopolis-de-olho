<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Prévia do vídeo</title>
<!-- toca cenas.html em tempo real com o áudio, para aprovar antes de gerar o mp4 -->
<style>
html,body{margin:0;height:100%;background:#0d0e10;color:#ece9df;font:16px system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;box-sizing:border-box}
#caixa{position:relative;overflow:hidden;border-radius:12px;background:#17191c}
iframe{position:absolute;left:0;top:0;width:1080px;height:1920px;border:0;transform-origin:0 0}
#barra{display:flex;gap:10px;align-items:center}
button{background:#f6c21a;color:#17150e;border:0;border-radius:10px;padding:10px 22px;font-weight:700;font-size:16px;cursor:pointer}
input{width:220px}
</style></head><body>
<div id="caixa"><iframe id="f" src="cenas.html"></iframe></div>
<div id="barra"><button id="bt">▶ Tocar</button><input id="pos" type="range" min="0" max="60" step="0.01" value="0"><span id="tt">0,0 s</span></div>
<audio id="a" preload="auto"></audio>
<script>
const f = document.getElementById('f'), a = document.getElementById('a'), pos = document.getElementById('pos'), caixa = document.getElementById('caixa');
function caber(){ const h = innerHeight - 90, esc = Math.min(h/1920, (innerWidth-24)/1080); caixa.style.width = 1080*esc+'px'; caixa.style.height = 1920*esc+'px'; f.style.transform = 'scale('+esc+')'; }
addEventListener('resize', caber); caber();
function quadro(){ const r = f.contentWindow && f.contentWindow.render; if (r) r(a.currentTime); pos.value = a.currentTime; document.getElementById('tt').textContent = a.currentTime.toFixed(1).replace('.',',')+' s'; if (!a.paused) requestAnimationFrame(quadro); }
document.getElementById('bt').onclick = () => { if (a.paused) { a.play(); requestAnimationFrame(quadro); bt.textContent = '❚❚ Pausar'; } else { a.pause(); bt.textContent = '▶ Tocar'; } };
a.onended = () => { bt.textContent = '▶ Tocar'; };
pos.oninput = () => { a.currentTime = +pos.value; quadro(); };
f.onload = () => { pos.max = f.contentWindow.DURACAO || 60; quadro(); };
/* o áudio vem inteiro na memória: o servidor local não deixa pular para o meio do arquivo */
fetch('_audio/mix.wav?'+Date.now()).then(r => r.blob()).then(b => { a.src = URL.createObjectURL(b); });
</script>
</body></html>
